<section class="sec soft"><div class="wrap owner">
  <img src="{{cv.site_owner_photo_url}}" alt="{{cv.business_owner_name}}, owner of {{cv.business_name}}" width="640" height="640" loading="lazy" decoding="async">
  <div>
    <span class="eyebrow">Locally owned since {{cv.site_founded_year}}</span>
    <h2>A local {{cv.site_trade_person}} who picks up the phone</h2>
    <p class="lead">{{cv.site_owner_bio}}</p>
    <p class="lead">{{cv.site_guarantee}}</p>
    <p class="sig">{{cv.business_owner_name}}, Owner, {{cv.business_name}}</p>
    <div class="btn-row"><a class="btn btn-accent" href="#quote">Get My Free Quote</a><a class="btn btn-ghost" style="color:var(--brand)" href="tel:{{cv.site_phone_link}}">{{icon:phone}} {{cv.site_phone_display}}</a></div>
  </div>
</div></section>
