<section class="sec" id="reviews"><div class="wrap center">
  <span class="eyebrow">Reviews</span>
  <h2>What {{cv.site_city}} locals say about us</h2>
  <div class="rev-widget">{{reviews_widget}}</div>
  <div class="btn-row" style="justify-content:center;margin-top:32px">
    <a class="btn btn-accent" href="#quote">Get My Free Quote</a>
    <a class="btn btn-ghost" style="color:var(--brand)" href="{{cv.site_google_maps_url}}" target="_blank" rel="noopener noreferrer">Read all reviews on Google</a>
  </div>
  <p style="margin-top:16px;font-size:.9rem"><a href="{{cv.google_review_link}}" target="_blank" rel="noopener noreferrer">Already a customer? Leave us a review</a></p>
</div></section>
