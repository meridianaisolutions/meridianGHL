<section class="sec" id="reviews"><div class="wrap center">
  <span class="eyebrow">Reviews</span>
  <h2>What {{cv.site_city}} locals say about us</h2>
  <a class="g-badge" href="{{cv.site_google_maps_url}}" target="_blank" rel="noopener noreferrer">{{icon:google}} <span class="stars" aria-hidden="true">{{stars}}</span> {{cv.site_google_rating}} / 5 from {{cv.site_google_review_count}} Google reviews</a>
  <div class="grid g3 rev" style="text-align:left">
    <figure class="card" style="margin:0"><span class="stars" role="img" aria-label="5 out of 5 stars">{{stars}}</span><blockquote>{{cv.site_review_1_text}}</blockquote><figcaption><cite>{{cv.site_review_1_name}} <span>{{cv.site_review_1_suburb}}</span></cite></figcaption></figure>
    <figure class="card" style="margin:0"><span class="stars" role="img" aria-label="5 out of 5 stars">{{stars}}</span><blockquote>{{cv.site_review_2_text}}</blockquote><figcaption><cite>{{cv.site_review_2_name}} <span>{{cv.site_review_2_suburb}}</span></cite></figcaption></figure>
    <figure class="card" style="margin:0"><span class="stars" role="img" aria-label="5 out of 5 stars">{{stars}}</span><blockquote>{{cv.site_review_3_text}}</blockquote><figcaption><cite>{{cv.site_review_3_name}} <span>{{cv.site_review_3_suburb}}</span></cite></figcaption></figure>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:32px">
    <a class="btn btn-ghost" style="color:var(--brand)" href="{{cv.site_google_maps_url}}" target="_blank" rel="noopener noreferrer">Read all reviews on Google</a>
    <a class="btn btn-accent" href="{{cv.google_review_link}}" target="_blank" rel="noopener noreferrer">Leave us a review</a>
  </div>
</div></section>
